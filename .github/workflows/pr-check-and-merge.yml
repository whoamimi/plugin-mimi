name: PR check and merge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          pip install ruff==0.16.8
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck tree

      - name: Validate marketplace and plugins (strict)
        run: |
          claude plugin validate --strict .
          for plugin in plugins/*/; do
            claude plugin validate --strict "$plugin"
          done

      - name: Lint skills against authoring best practices
        run: python3 scripts/lint-plugins.py

      - name: Lint Python scripts
        run: ruff check --select E9,F .

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Check README directory tree is current
        run: |
          scripts/update-readme-tree.sh
          if ! git diff --quiet README.md; then
            echo "::error file=README.md::Directory tree is out of date. Run scripts/update-readme-tree.sh and commit."
            git diff README.md
            exit 1
          fi

  merge:
    needs: check
    # Only auto-merge branches from this repository, not forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge

  update-readme:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install tree CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tree

      - name: Regenerate README directory tree
        run: scripts/update-readme-tree.sh

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "README tree already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update README directory tree"
          git pull --rebase origin main
          git push origin HEAD:main
